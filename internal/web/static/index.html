<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>turnstile console</title>
<style>
  :root {
    --bg: #f6f7f9;
    --panel: #ffffff;
    --panel-2: #f0f2f5;
    --border: #d9dee5;
    --text: #1c2230;
    --muted: #64707f;
    --accent: #2f6fed;
    --accent-soft: #e5eefc;
    --green: #1f9d55;
    --amber: #c77700;
    --red: #d23b3b;
    --llm: #6c4ce0;
    --lease: #0d8a8a;
    --shadow: 0 1px 2px rgba(20,30,50,.06), 0 4px 14px rgba(20,30,50,.05);
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1116;
      --panel: #171b22;
      --panel-2: #1e242d;
      --border: #2b333f;
      --text: #e6e9ee;
      --muted: #8b96a5;
      --accent: #5a8dff;
      --accent-soft: #1b2740;
      --green: #3ecf7a;
      --amber: #e0a13a;
      --red: #f0605f;
      --llm: #a58cff;
      --lease: #3ec7c7;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 22px; border-bottom: 1px solid var(--border);
    background: var(--panel); position: sticky; top: 0; z-index: 5;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 650; letter-spacing: .3px; }
  header .sub { color: var(--muted); font-size: 12px; }
  .conn { margin-left: auto; display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--muted); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
  .dot.live { background: var(--green); box-shadow: 0 0 0 3px color-mix(in srgb, var(--green) 25%, transparent); }
  .dot.poll { background: var(--amber); }
  .dot.down { background: var(--red); }
  main { max-width: 1180px; margin: 0 auto; padding: 20px; display: grid; gap: 18px; }
  .grid { display: grid; grid-template-columns: minmax(280px, 1fr) 2fr; gap: 18px; align-items: start; }
  @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }
  .panel {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    box-shadow: var(--shadow); overflow: hidden;
  }
  .panel > h2 {
    font-size: 12px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted);
    margin: 0; padding: 12px 16px; border-bottom: 1px solid var(--border); font-weight: 650;
  }
  .panel .body { padding: 16px; }
  .holder-idle { color: var(--muted); font-style: italic; padding: 6px 0; }
  .holder-name { font-size: 20px; font-weight: 650; display: flex; align-items: center; gap: 10px; }
  .held { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .chip {
    display: inline-flex; align-items: center; gap: 5px; font-size: 12px;
    padding: 3px 9px; border-radius: 999px; background: var(--panel-2);
    border: 1px solid var(--border); color: var(--muted);
  }
  .chip b { color: var(--text); font-weight: 600; }
  .kind { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px;
          padding: 2px 8px; border-radius: 6px; }
  .kind.llm { color: var(--llm); background: color-mix(in srgb, var(--llm) 16%, transparent); }
  .kind.lease { color: var(--lease); background: color-mix(in srgb, var(--lease) 16%, transparent); }
  .prio-pill { font-family: var(--mono); font-size: 12px; padding: 2px 7px; border-radius: 6px;
    background: var(--accent-soft); color: var(--accent); font-weight: 600; }

  table { width: 100%; border-collapse: collapse; }
  thead th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .6px;
    color: var(--muted); font-weight: 600; padding: 6px 10px; border-bottom: 1px solid var(--border); }
  tbody td { padding: 9px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr.revoke { background: color-mix(in srgb, var(--red) 10%, transparent); }
  .pos { font-family: var(--mono); color: var(--muted); }
  .wait { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .state { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
  .revoke-tag { font-size: 10px; font-weight: 700; color: var(--red); text-transform: uppercase;
    border: 1px solid var(--red); border-radius: 5px; padding: 1px 5px; margin-left: 6px; }
  .empty { color: var(--muted); font-style: italic; padding: 14px 10px; }

  form.mint { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; margin-top: 14px;
    padding-top: 14px; border-top: 1px solid var(--border); }
  .field { display: flex; flex-direction: column; gap: 3px; }
  .field label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
  input {
    background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 7px 9px; font: inherit; min-width: 0;
  }
  input[type=number] { width: 90px; }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button {
    font: inherit; font-weight: 600; cursor: pointer; border-radius: 8px;
    border: 1px solid var(--border); background: var(--panel-2); color: var(--text);
    padding: 7px 13px;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { color: var(--red); border-color: color-mix(in srgb, var(--red) 40%, var(--border)); padding: 4px 10px; font-size: 12px; }
  button:hover { filter: brightness(1.05); }
  button:disabled { opacity: .5; cursor: default; }

  .secret {
    margin-top: 12px; padding: 12px 14px; border-radius: 10px;
    background: color-mix(in srgb, var(--green) 12%, transparent);
    border: 1px solid color-mix(in srgb, var(--green) 45%, var(--border));
  }
  .secret .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--green); font-weight: 700; }
  .secret code { display: block; font-family: var(--mono); font-size: 13px; word-break: break-all;
    margin: 6px 0; user-select: all; }
  .secret small { color: var(--muted); }
  .err { color: var(--red); font-size: 12px; margin-top: 8px; min-height: 1em; }
  .updated { color: var(--muted); font-size: 11px; }

  /* ---- timeline ---- */
  #timeline-panel > h2 { display: flex; align-items: center; gap: 12px; }
  .tl-controls { margin-left: auto; display: flex; align-items: center; gap: 8px;
    text-transform: none; letter-spacing: 0; }
  .tl-windows { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .tl-windows button { border: 0; border-radius: 0; background: var(--panel); color: var(--muted);
    padding: 4px 11px; font-size: 12px; font-weight: 600; border-right: 1px solid var(--border); }
  .tl-windows button:last-child { border-right: 0; }
  .tl-windows button.active { background: var(--accent); color: #fff; }
  .tl-now { padding: 4px 11px; font-size: 12px; }
  .tl-now:disabled { opacity: .45; }
  #tl-wrap { position: relative; padding: 12px 16px 4px; }
  #tl-canvas { display: block; width: 100%; height: 104px; cursor: grab; touch-action: none; }
  #tl-canvas.drag { cursor: grabbing; }
  .tl-tip { position: fixed; pointer-events: none; z-index: 2147483647; max-width: 260px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    box-shadow: var(--shadow); padding: 8px 10px; font-size: 12px; transform: translate(-50%, 0); }
  .tl-tip .tl-tip-name { font-weight: 650; display: flex; align-items: center; gap: 7px; }
  .tl-tip .sw { width: 10px; height: 10px; border-radius: 3px; flex: 0 0 auto; }
  .tl-tip dl { margin: 6px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; }
  .tl-tip dt { color: var(--muted); }
  .tl-tip dd { margin: 0; font-variant-numeric: tabular-nums; }
  .tl-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 8px 16px 14px; }
  .tl-legend .lg { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .tl-legend .sw { width: 11px; height: 11px; border-radius: 3px; }
  .tl-legend .lg b { color: var(--text); font-weight: 600; }
  .tl-hint { color: var(--muted); font-size: 11px; font-weight: 400; text-transform: none; letter-spacing: 0; }
</style>
</head>
<body>
<header>
  <div>
    <h1>turnstile</h1>
    <div class="sub">GPU access console</div>
  </div>
  <div class="conn">
    <span id="updated" class="updated"></span>
    <span id="dot" class="dot"></span>
    <span id="conn-label">connecting…</span>
  </div>
</header>

<main>
  <section class="panel" id="timeline-panel">
    <h2>
      GPU timeline
      <span class="tl-hint">drag to pan</span>
      <span class="tl-controls">
        <span class="tl-windows" id="tl-windows">
          <button data-win="1h">1h</button>
          <button data-win="1d" class="active">1d</button>
          <button data-win="7d">7d</button>
        </span>
        <button class="tl-now" id="tl-now" disabled>now ▸</button>
      </span>
    </h2>
    <div class="body" style="padding:0">
      <div id="tl-wrap">
        <canvas id="tl-canvas"></canvas>
        <div class="tl-tip" id="tl-tip" hidden></div>
      </div>
      <div class="tl-legend" id="tl-legend"></div>
    </div>
  </section>

  <div class="grid">
    <section class="panel" id="holder-panel">
      <h2>GPU holder</h2>
      <div class="body" id="holder-body">
        <div class="holder-idle">idle</div>
        <div class="meta" id="warm-meta"></div>
      </div>
    </section>

    <section class="panel">
      <h2>Pending queue</h2>
      <div class="body" style="padding:0">
        <table>
          <thead>
            <tr>
              <th style="width:44px">#</th>
              <th>Name</th>
              <th>Kind</th>
              <th>Prio</th>
              <th>State</th>
              <th style="text-align:right">Wait</th>
            </tr>
          </thead>
          <tbody id="pending-body">
            <tr><td colspan="6" class="empty">no waiters</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </div>

  <section class="panel">
    <h2>Keys</h2>
    <div class="body">
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Priority</th>
            <th>Created</th>
            <th style="text-align:right">Actions</th>
          </tr>
        </thead>
        <tbody id="keys-body">
          <tr><td colspan="4" class="empty">no keys</td></tr>
        </tbody>
      </table>

      <form class="mint" id="mint-form">
        <div class="field">
          <label for="k-name">Name</label>
          <input id="k-name" name="name" placeholder="e.g. pi" autocomplete="off" required>
        </div>
        <div class="field">
          <label for="k-prio">Priority</label>
          <input id="k-prio" name="priority" type="number" value="0" step="1">
        </div>
        <button class="primary" type="submit">Mint key</button>
      </form>
      <div class="err" id="mint-err"></div>
      <div id="secret-box"></div>
    </div>
  </section>
</main>

<script>
(function () {
  "use strict";

  var latest = null;        // last snapshot
  var latestReceived = 0;   // ms epoch when received (client clock)
  var es = null;
  var pollTimer = null;

  var $ = function (id) { return document.getElementById(id); };

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function fmtDuration(sec) {
    sec = Math.max(0, Math.floor(sec));
    var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
    if (h > 0) return h + "h " + m + "m " + s + "s";
    if (m > 0) return m + "m " + s + "s";
    return s + "s";
  }

  function fmtDate(iso) {
    if (!iso) return "—";
    var d = new Date(iso);
    if (isNaN(d)) return "—";
    return d.toLocaleString();
  }

  // Age in seconds of an ISO timestamp relative to snapshot time, kept
  // smooth by adding the drift since we received the snapshot.
  function ageSeconds(iso) {
    if (!iso) return 0;
    var t = new Date(iso).getTime();
    if (isNaN(t)) return 0;
    var drift = (Date.now() - latestReceived) / 1000;
    var base = latest && latest.updated_at ? new Date(latest.updated_at).getTime() : latestReceived;
    return (base - t) / 1000 + drift;
  }

  function kindTag(kind) {
    var k = kind === "llm" ? "llm" : "lease";
    return '<span class="kind ' + k + '">' + esc(k) + '</span>';
  }

  function setConn(mode) {
    var dot = $("dot"), label = $("conn-label");
    dot.className = "dot " + mode;
    label.textContent = mode === "live" ? "live stream"
      : mode === "poll" ? "polling"
      : mode === "down" ? "disconnected" : "connecting…";
  }

  function renderHolder() {
    var body = $("holder-body");
    var warm = "";
    if (latest && latest.warm_model) {
      warm += '<span class="chip">warm model <b>' + esc(latest.warm_model) + '</b></span>';
    } else {
      warm += '<span class="chip">warm model <b>none</b></span>';
    }
    warm += '<span class="chip">warm tier <b>' + esc(latest ? latest.warm_tier : 0) + '</b></span>';

    var h = latest && latest.holder;
    var html;
    if (!h) {
      html = '<div class="holder-idle">GPU idle</div>';
    } else {
      var held = h.granted_at ? fmtDuration(ageSeconds(h.granted_at)) : "—";
      html =
        '<div class="holder-name">' + esc(h.name) + ' ' + kindTag(h.kind) +
        (h.revoke_requested ? '<span class="revoke-tag">revoking</span>' : '') + '</div>' +
        '<div class="held">holding for <span class="wait" data-granted="' + esc(h.granted_at || "") + '">' + held + '</span></div>' +
        '<div class="meta">' +
          '<span class="chip">priority <span class="prio-pill">' + esc(h.priority) + '</span></span>' +
          (h.model ? '<span class="chip">model <b>' + esc(h.model) + '</b></span>' : '') +
          '<span class="chip state">' + esc(h.state) + '</span>' +
        '</div>';
    }
    body.innerHTML = html + '<div class="meta" id="warm-meta">' + warm + '</div>';
  }

  function renderPending() {
    var tb = $("pending-body");
    var list = (latest && latest.pending) || [];
    if (!list.length) {
      tb.innerHTML = '<tr><td colspan="6" class="empty">no waiters</td></tr>';
      return;
    }
    var rows = list.map(function (w) {
      var wait = fmtDuration(ageSeconds(w.enqueued_at));
      return '<tr class="' + (w.revoke_requested ? "revoke" : "") + '">' +
        '<td class="pos">' + esc(w.position) + '</td>' +
        '<td>' + esc(w.name) +
          (w.revoke_requested ? '<span class="revoke-tag">revoke</span>' : '') +
          (w.model ? '<div class="state">' + esc(w.model) + '</div>' : '') + '</td>' +
        '<td>' + kindTag(w.kind) + '</td>' +
        '<td><span class="prio-pill">' + esc(w.priority) + '</span></td>' +
        '<td class="state">' + esc(w.state) + '</td>' +
        '<td class="wait" style="text-align:right" data-enq="' + esc(w.enqueued_at) + '">' + wait + '</td>' +
        '</tr>';
    });
    tb.innerHTML = rows.join("");
  }

  function renderUpdated() {
    if (latest && latest.updated_at) {
      $("updated").textContent = "updated " + fmtDate(latest.updated_at);
    }
  }

  function render() {
    renderHolder();
    renderPending();
    renderUpdated();
  }

  // Smoothly tick the counters between snapshots without a full re-render.
  function tickCounters() {
    if (!latest) return;
    document.querySelectorAll("[data-enq]").forEach(function (el) {
      el.textContent = fmtDuration(ageSeconds(el.getAttribute("data-enq")));
    });
    document.querySelectorAll("[data-granted]").forEach(function (el) {
      var g = el.getAttribute("data-granted");
      if (g) el.textContent = fmtDuration(ageSeconds(g));
    });
  }

  function applySnapshot(snap) {
    latest = snap;
    latestReceived = Date.now();
    render();
    try { Timeline.setLive(snap); } catch (e) {}
  }

  // ---- live updates: EventSource, degrading to polling ----
  function startPolling() {
    if (pollTimer) return;
    setConn("poll");
    var poll = function () {
      fetch("/api/queue", { cache: "no-store" })
        .then(function (r) { return r.json(); })
        .then(applySnapshot)
        .catch(function () { setConn("down"); });
    };
    poll();
    pollTimer = setInterval(poll, 1500);
  }

  function stopPolling() {
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  }

  function startStream() {
    if (!window.EventSource) { startPolling(); return; }
    try {
      es = new EventSource("/api/queue/stream");
    } catch (e) { startPolling(); return; }

    es.onopen = function () { stopPolling(); setConn("live"); };
    es.onmessage = function (ev) {
      try { applySnapshot(JSON.parse(ev.data)); setConn("live"); } catch (e) {}
    };
    es.onerror = function () {
      // Browser auto-reconnects EventSource; meanwhile fall back to polling
      // so the console keeps updating.
      setConn("poll");
      startPolling();
    };
  }

  // ---- keys ----
  function loadKeys() {
    fetch("/api/keys", { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(renderKeys)
      .catch(function () {});
  }

  function renderKeys(keys) {
    var tb = $("keys-body");
    if (!keys || !keys.length) {
      tb.innerHTML = '<tr><td colspan="4" class="empty">no keys</td></tr>';
      return;
    }
    tb.innerHTML = keys.map(function (k) {
      return '<tr>' +
        '<td><b>' + esc(k.name) + '</b></td>' +
        '<td><span class="prio-pill">' + esc(k.priority || 0) + '</span></td>' +
        '<td class="state">' + fmtDate(k.created) + '</td>' +
        '<td style="text-align:right"><button class="danger" data-revoke="' + esc(k.name) + '">Revoke</button></td>' +
        '</tr>';
    }).join("");
  }

  $("keys-body").addEventListener("click", function (ev) {
    var btn = ev.target.closest("button[data-revoke]");
    if (!btn) return;
    var name = btn.getAttribute("data-revoke");
    if (!confirm('Revoke key "' + name + '"?')) return;
    btn.disabled = true;
    fetch("/api/keys/" + encodeURIComponent(name), { method: "DELETE" })
      .then(function (r) {
        if (r.status === 204) { loadKeys(); }
        else { btn.disabled = false; alert("Revoke failed (" + r.status + ")"); }
      })
      .catch(function () { btn.disabled = false; alert("Revoke failed"); });
  });

  $("mint-form").addEventListener("submit", function (ev) {
    ev.preventDefault();
    $("mint-err").textContent = "";
    $("secret-box").innerHTML = "";
    var name = $("k-name").value.trim();
    var prio = parseInt($("k-prio").value, 10) || 0;
    if (!name) { $("mint-err").textContent = "Name is required."; return; }
    var btn = ev.target.querySelector("button");
    btn.disabled = true;
    fetch("/api/keys", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: name, priority: prio })
    }).then(function (r) {
      return r.json().then(function (data) { return { status: r.status, data: data }; });
    }).then(function (res) {
      btn.disabled = false;
      if (res.status === 201) {
        $("k-name").value = "";
        showSecret(res.data);
        loadKeys();
      } else {
        $("mint-err").textContent = (res.data && res.data.error) || ("Mint failed (" + res.status + ")");
      }
    }).catch(function () {
      btn.disabled = false;
      $("mint-err").textContent = "Mint failed.";
    });
  });

  function showSecret(info) {
    $("secret-box").innerHTML =
      '<div class="secret">' +
        '<div class="lbl">New key for ' + esc(info.name) + ' — copy it now, shown once</div>' +
        '<code>' + esc(info.key || "") + '</code>' +
        '<small>priority ' + esc(info.priority || 0) + '</small>' +
      '</div>';
  }

  // ---- timeline ----
  var Timeline = (function () {
    var WINDOWS = { "1h": 3600e3, "1d": 86400e3, "7d": 604800e3 };
    var MAX_SPAN = WINDOWS["7d"]; // furthest back we keep/fetch history for
    var PALETTE = ["#5a8dff", "#3ecf7a", "#e0a13a", "#f0605f", "#a58cff",
                   "#3ec7c7", "#e06fb4", "#8bc34a", "#ff8a5b", "#7a88c9"];
    var PAD_L = 16, PAD_R = 16;      // canvas horizontal padding (CSS px)
    var TRACK_TOP = 12, TRACK_H = 46, AXIS_Y = TRACK_TOP + TRACK_H;

    var canvas, ctx, tip, legendEl, nowBtn, winWrap;
    var completed = [];   // {id,name,priority,kind,model,start,end}
    var liveOpen = null;  // current holder as an open record (end == null)
    var windowMs = WINDOWS["1d"];
    var viewEnd = Date.now();
    var follow = true;
    var dpr = 1, cssW = 0, cssH = 0, plotW = 0;
    var drawn = [];       // hit-test rects: {x0,x1,rec}
    var dragging = false, dragStartX = 0, dragStartEnd = 0, moved = false;

    function colorFor(name) {
      var h = 0, s = String(name || "");
      for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
      return PALETTE[h % PALETTE.length];
    }

    function toMs(iso) { var t = iso ? new Date(iso).getTime() : NaN; return isNaN(t) ? null : t; }

    function normalize(r) {
      return { id: r.id, name: r.name, priority: r.priority, kind: r.kind,
               model: r.model || "", start: toMs(r.started_at), end: toMs(r.ended_at) };
    }

    function records() {
      var all = completed.slice();
      if (liveOpen && liveOpen.start != null) all.push(liveOpen);
      return all;
    }

    function clampView() {
      var now = Date.now();
      var maxEnd = now;
      var minEnd = (now - MAX_SPAN) + windowMs;
      if (minEnd > maxEnd) minEnd = maxEnd;
      if (viewEnd > maxEnd) viewEnd = maxEnd;
      if (viewEnd < minEnd) viewEnd = minEnd;
      follow = (maxEnd - viewEnd) < 1500;
      if (nowBtn) nowBtn.disabled = follow;
    }

    function timeToX(t) { var vs = viewEnd - windowMs; return PAD_L + (t - vs) / windowMs * plotW; }
    function xToTime(x) { var vs = viewEnd - windowMs; return vs + (x - PAD_L) / plotW * windowMs; }

    function resize() {
      if (!canvas) return;
      dpr = window.devicePixelRatio || 1;
      cssW = canvas.clientWidth; cssH = canvas.clientHeight;
      plotW = Math.max(1, cssW - PAD_L - PAD_R);
      canvas.width = Math.round(cssW * dpr);
      canvas.height = Math.round(cssH * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      draw();
    }

    function css(name) {
      return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    }

    function niceStep() {
      if (windowMs <= WINDOWS["1h"]) return 10 * 60e3;      // 10 min
      if (windowMs <= WINDOWS["1d"]) return 3 * 3600e3;     // 3 h
      return 86400e3;                                       // 1 day
    }

    function fmtTick(t, step) {
      var d = new Date(t);
      if (step >= 86400e3) return (d.getMonth() + 1) + "/" + d.getDate();
      return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
    }

    function draw() {
      if (!ctx) return;
      clampView();
      var now = Date.now();
      ctx.clearRect(0, 0, cssW, cssH);
      drawn = [];

      var border = css("--border"), muted = css("--muted"), text = css("--text");
      var panel2 = css("--panel-2"), accent = css("--accent");

      // track background
      ctx.fillStyle = panel2;
      roundRect(PAD_L, TRACK_TOP, plotW, TRACK_H, 6); ctx.fill();

      // axis grid + labels
      var step = niceStep(), vs = viewEnd - windowMs;
      ctx.font = "11px system-ui, sans-serif";
      ctx.textBaseline = "top";
      for (var t = Math.ceil(vs / step) * step; t <= viewEnd; t += step) {
        var x = timeToX(t);
        ctx.strokeStyle = border; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(x + 0.5, TRACK_TOP); ctx.lineTo(x + 0.5, AXIS_Y); ctx.stroke();
        ctx.fillStyle = muted; ctx.textAlign = "center";
        ctx.fillText(fmtTick(t, step), x, AXIS_Y + 6);
      }

      // hold bars
      var list = records();
      for (var i = 0; i < list.length; i++) {
        var r = list[i];
        if (r.start == null) continue;
        var end = r.end == null ? now : r.end;
        var sx = timeToX(r.start), ex = timeToX(end);
        if (ex < PAD_L || sx > PAD_L + plotW) continue;
        sx = Math.max(sx, PAD_L); ex = Math.min(ex, PAD_L + plotW);
        var w = Math.max(1.5, ex - sx);
        var col = colorFor(r.name);
        ctx.save();
        roundRect(sx, TRACK_TOP + 4, w, TRACK_H - 8, 3); ctx.clip();
        ctx.fillStyle = col; ctx.fillRect(sx, TRACK_TOP + 4, w, TRACK_H - 8);
        if (r.kind === "lease") hatch(sx, TRACK_TOP + 4, w, TRACK_H - 8);
        if (r.end == null) { // open hold: soft leading edge glow
          ctx.fillStyle = "rgba(255,255,255,.35)";
          ctx.fillRect(ex - 2, TRACK_TOP + 4, 2, TRACK_H - 8);
        }
        if (w > 34) {
          ctx.fillStyle = "#fff"; ctx.textAlign = "left"; ctx.textBaseline = "middle";
          ctx.font = "600 11px system-ui, sans-serif";
          ctx.fillText(r.name, sx + 5, TRACK_TOP + TRACK_H / 2);
        }
        ctx.restore();
        drawn.push({ x0: sx, x1: ex, rec: r, end: end });
      }

      // "now" marker
      if (now >= vs && now <= viewEnd) {
        var nx = timeToX(now);
        ctx.strokeStyle = accent; ctx.lineWidth = 1.5;
        ctx.setLineDash([3, 3]);
        ctx.beginPath(); ctx.moveTo(nx, TRACK_TOP - 2); ctx.lineTo(nx, AXIS_Y + 2); ctx.stroke();
        ctx.setLineDash([]);
      }

      renderLegend(list);
    }

    function roundRect(x, y, w, h, r) {
      r = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function hatch(x, y, w, h) {
      ctx.strokeStyle = "rgba(0,0,0,.22)"; ctx.lineWidth = 1;
      for (var i = -h; i < w; i += 7) {
        ctx.beginPath(); ctx.moveTo(x + i, y + h); ctx.lineTo(x + i + h, y); ctx.stroke();
      }
    }

    function renderLegend(list) {
      var seen = {};
      list.forEach(function (r) {
        if (!seen[r.name]) seen[r.name] = { color: colorFor(r.name), prio: r.priority };
      });
      var names = Object.keys(seen).sort();
      if (!names.length) { legendEl.innerHTML = '<span class="lg">no activity in this window</span>'; return; }
      legendEl.innerHTML = names.map(function (n) {
        return '<span class="lg"><span class="sw" style="background:' + seen[n].color + '"></span>' +
          '<b>' + esc(n) + '</b> · prio ' + esc(seen[n].prio) + '</span>';
      }).join("");
    }

    function hit(px, py) {
      for (var i = drawn.length - 1; i >= 0; i--) {
        var d = drawn[i];
        if (px >= d.x0 - 1 && px <= d.x1 + 1 && py >= TRACK_TOP && py <= AXIS_Y) return d;
      }
      return null;
    }

    function showTip(d, px) {
      var r = d.rec, end = d.end;
      var dur = fmtDuration((end - r.start) / 1000);
      var when = new Date(r.start).toLocaleString() +
        (r.end == null ? " → now" : " → " + new Date(end).toLocaleTimeString());
      tip.innerHTML =
        '<div class="tl-tip-name"><span class="sw" style="background:' + colorFor(r.name) + '"></span>' +
          esc(r.name) + ' ' + kindTag(r.kind) + (r.end == null ? '<span class="revoke-tag" style="border-color:var(--green);color:var(--green)">active</span>' : '') + '</div>' +
        '<dl>' +
          '<dt>when</dt><dd>' + esc(when) + '</dd>' +
          '<dt>held</dt><dd>' + esc(dur) + '</dd>' +
          '<dt>priority</dt><dd>' + esc(r.priority) + '</dd>' +
          (r.model ? '<dt>model</dt><dd>' + esc(r.model) + '</dd>' : '') +
        '</dl>';
      tip.hidden = false;
      tip.style.transform = "translate(-50%, 0)";
      var canvasRect = canvas.getBoundingClientRect();
      var tipRect = tip.getBoundingClientRect();
      var halfWidth = tipRect.width / 2;
      var left = canvasRect.left + px;
      left = Math.min(Math.max(left, halfWidth + 8), window.innerWidth - halfWidth - 8);
      var top = canvasRect.top + AXIS_Y + 6;
      if (top + tipRect.height + 8 > window.innerHeight) {
        top = canvasRect.top + TRACK_TOP - 6;
        tip.style.transform = "translate(-50%, -100%)";
      }
      tip.style.left = left + "px";
      tip.style.top = top + "px";
    }

    function hideTip() { if (tip) tip.hidden = true; }

    function onMove(e) {
      var rect = canvas.getBoundingClientRect();
      var px = e.clientX - rect.left, py = e.clientY - rect.top;
      if (dragging) {
        var dx = e.clientX - dragStartX;
        if (Math.abs(dx) > 2) moved = true;
        viewEnd = dragStartEnd - dx * (windowMs / plotW);
        draw();
        return;
      }
      var d = hit(px, py);
      if (d) { showTip(d, px); canvas.style.cursor = "pointer"; }
      else { hideTip(); canvas.style.cursor = ""; }
    }

    function onDown(e) {
      dragging = true; moved = false;
      dragStartX = e.clientX; dragStartEnd = viewEnd;
      canvas.classList.add("drag"); hideTip();
      canvas.setPointerCapture && canvas.setPointerCapture(e.pointerId);
    }
    function onUp() { dragging = false; canvas.classList.remove("drag"); }

    function setWindow(win) {
      windowMs = WINDOWS[win] || windowMs;
      [].forEach.call(winWrap.querySelectorAll("button"), function (b) {
        b.classList.toggle("active", b.getAttribute("data-win") === win);
      });
      draw();
    }

    function snapNow() { viewEnd = Date.now(); follow = true; draw(); }

    function fetchHistory() {
      fetch("/api/history?window=7d", { cache: "no-store" })
        .then(function (r) { return r.json(); })
        .then(function (recs) {
          completed = (recs || []).filter(function (r) { return r.ended_at; }).map(normalize);
          draw();
        })
        .catch(function () {});
    }

    // Feed the live holder from the queue snapshot so the open bar grows in real time.
    function setLive(snap) {
      var h = snap && snap.holder;
      if (h && h.granted_at) {
        liveOpen = { id: h.id, name: h.name, priority: h.priority, kind: h.kind,
                     model: h.model || "", start: toMs(h.granted_at), end: null };
      } else {
        liveOpen = null;
      }
    }

    function init() {
      canvas = $("tl-canvas"); tip = $("tl-tip"); legendEl = $("tl-legend");
      nowBtn = $("tl-now"); winWrap = $("tl-windows");
      if (!canvas || !canvas.getContext) return;
      ctx = canvas.getContext("2d");
      // Escape the panel's overflow clipping and stacking context.
      document.body.appendChild(tip);

      winWrap.addEventListener("click", function (e) {
        var b = e.target.closest("button[data-win]"); if (b) setWindow(b.getAttribute("data-win"));
      });
      nowBtn.addEventListener("click", snapNow);
      canvas.addEventListener("pointerdown", onDown);
      canvas.addEventListener("pointermove", onMove);
      window.addEventListener("pointerup", onUp);
      canvas.addEventListener("pointerleave", function () { if (!dragging) hideTip(); });
      window.addEventListener("resize", resize);
      if (window.ResizeObserver) new ResizeObserver(resize).observe(canvas);

      resize();
      fetchHistory();
      setInterval(fetchHistory, 4000);
      // Redraw ~2x/sec so the live edge and "now" marker advance smoothly.
      setInterval(function () { if (follow) viewEnd = Date.now(); draw(); }, 500);
    }

    return { init: init, setLive: setLive };
  })();

  // ---- boot ----
  Timeline.init();
  startStream();
  loadKeys();
  setInterval(tickCounters, 1000);
})();
</script>
</body>
</html>
